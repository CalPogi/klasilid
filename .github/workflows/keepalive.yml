# The free Supabase plan pauses a project after a week with no requests (school breaks).
# One harmless request a week keeps it awake. Remove after upgrading to Pro.
name: keepalive
on:
  schedule:
    - cron: '0 1 * * 1' # Mondays 09:00 Manila
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" -o /dev/null
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
