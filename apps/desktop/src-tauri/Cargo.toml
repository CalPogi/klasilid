[package]
name = "klasilid"
version = "0.0.0"
description = "Klasilid teacher app"
edition = "2021"

[lib]
name = "klasilid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to the same minor as the locked @tauri-apps npm packages: tauri-cli refuses mismatched pairs.
# Bump both sides in the same commit.
tauri = { version = "~2.12", features = [] }
tauri-plugin-process = "~2.4"
tauri-plugin-http = "~2.9"
tauri-plugin-opener = "~2.7"
# tauri::generate_context! expands to code that uses serde and serde_json directly.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "~2.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
