; Klasilid door reader (plan 5). Build: python -m platformio run   Tests on the board: python -m platformio test -e esp32dev
[env:esp32dev]
platform = espressif32@6.9.0   ; Arduino core 2.0.17; pinned so a rebuild next year gets the same code
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
test_framework = unity
; deep+ so Adafruit BusIO (pulled in by RTClib) finds the framework's SPI and Wire
lib_ldf_mode = deep+
; U8g2 only enables its Wire1 (second bus) driver when the core defines WIRE_INTERFACES_COUNT > 1. The ESP32 core
; has Wire1 but never defines it, so without this every screen write silently went nowhere (found on the first reader).
build_flags = -DWIRE_INTERFACES_COUNT=2
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    olikraus/U8g2@^2.35.19
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.2.1
